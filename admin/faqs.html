d previous overseas experience to apply?\",\"answer\":\"Not necessarily. Many vacancies are open to candidates without prior overseas experience. Some positions may require specific work experience, which will be stated in the job description. We encourage you to apply for positions that match your skills.\",\"order\":2},{\"id\":\"faq-3\",\"category\":\"Applying for Jobs\",\"question\":\"Can I apply for multiple jobs at the same time?\",\"answer\":\"Yes, you may apply for multiple positions. However, we recommend applying only for roles that genuinely match your skills and qualifications to ensure the best outcomes.\",\"order\":3},{\"id\":\"faq-4\",\"category\":\"Documents\",\"question\":\"What documents are normally required for overseas employment?\",\"answer\":\"Typical documents include a valid Sri Lankan passport, National Identity Card (NIC), educational and professional certificates, and a CV. Additional documents such as medical reports and police clearance may be required at later stages. Our team will guide you through the specific requirements for each position.\",\"order\":4},{\"id\":\"faq-5\",\"category\":\"Documents\",\"question\":\"Do I need to obtain a passport before applying?\",\"answer\":\"You do not need a passport to initially apply. However, a valid passport will be required before the visa processing stage. We recommend applying for your passport early to avoid delays.\",\"order\":5},{\"id\":\"faq-6\",\"category\":\"Recruitment Process\",\"question\":\"How will I know whether I have been shortlisted?\",\"answer\":\"Shortlisted candidates are notified by phone and/or SMS. Please ensure your contact number is correct when applying. We recommend saving our contact number and checking your messages regularly.\",\"order\":6},{\"id\":\"faq-7\",\"category\":\"Recruitment Process\",\"question\":\"How long does the recruitment process take?\",\"answer\":\"The timeline varies depending on the position, the employer's requirements, and regulatory processing. We always aim to keep candidates informed at each stage.\",\"order\":7},{\"id\":\"faq-8\",\"category\":\"Recruitment Process\",\"question\":\"Will I need to attend an interview?\",\"answer\":\"Many positions require a face-to-face or online interview with the employer. Interview details will be communicated to shortlisted candidates. Some positions may require a practical skills test.\",\"order\":8},{\"id\":\"faq-9\",\"category\":\"Overseas Employment\",\"question\":\"What regulatory approvals are required before departure?\",\"answer\":\"Candidates should follow the current requirements published by the Sri Lanka Bureau of Foreign Employment (SLBFE) and other relevant authorities. For each confirmed role, the recruitment team should explain the applicable steps and official channels.\",\"order\":9},{\"id\":\"faq-10\",\"category\":\"Overseas Employment\",\"question\":\"Are job offers guaranteed?\",\"answer\":\"No job offer can be guaranteed. Final selection decisions are made by the employer following its interview and assessment. Visa approval and final employment outcomes also cannot be guaranteed.\",\"order\":10},{\"id\":\"faq-11\",\"category\":\"Employer Services\",\"question\":\"How can an overseas company recruit Sri Lankan workers through your agency?\",\"answer\":\"Overseas employers can submit a manpower requirement through our For Employers page. Our recruitment team will review the requirement and contact you to discuss how we can support your staffing needs.\",\"order\":11},{\"id\":\"faq-12\",\"category\":\"Contact \u0026 Support\",\"question\":\"How can I contact the recruitment team?\",\"answer\":\"You can contact us by phone, WhatsApp, or email during office hours. Our contact details are available on the Contact Us page. For urgent enquiries, WhatsApp is the fastest way to reach us.\",\"order\":12}]}]\nb:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n8:null\nd:[[\"$\",\"title\",\"0\",{\"children\":\"FAQs | Admin — A-One Agency\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Administrative control center for A-One Agency operations.\"}]]\n"])</script></body></html>
